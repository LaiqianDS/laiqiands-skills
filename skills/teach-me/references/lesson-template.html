<!doctype html>
<!--
  Copy this file, never link it. Fill every double-brace slot: a browser reads
  an angle-bracket placeholder as an unknown tag and silently renders nothing.
  Set <html lang> to the learner's language. Delete this comment in the copy.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{node}}</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #141414;
    --muted: #707070;
    --line: #e0e0e0;
    --card: #f3f3f3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141414;
      --fg: #ffffff;
      --muted: #adadad;
      --line: #3d3d3d;
      --card: #262626;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 2.5rem 1.25rem 4rem;
    background: var(--bg);
    color: var(--fg);
    font: 456 1rem/1.38 Saans, Inter, -apple-system, "Helvetica Neue", Arial, sans-serif;
  }
  main { max-width: 46rem; margin: 0 auto; }
  .eyebrow {
    color: var(--muted);
    font-size: .75rem;
    font-weight: 600;
    margin: 0 0 .4rem;
  }
  h1 { font-size: 2rem; font-weight: 652; line-height: 1.13; margin: 0 0 .5rem; }
  .shows { color: var(--muted); margin: 0 0 2rem; }

  /* The stage. Whatever the page exists to show goes in here. */
  .stage {
    background: var(--card);
    border-radius: 1.5rem;
    padding: 1.5rem;
    overflow-x: auto;
  }
  .stage svg { max-width: 100%; height: auto; display: block; }

  .caption { margin: 1rem 0 0; min-height: 3rem; }
  .controls { display: flex; align-items: center; gap: .75rem; margin-top: 1rem; }
  button {
    font: inherit;
    font-weight: 600;
    color: var(--fg);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 9999px;
    padding: .5rem 1rem;
    cursor: pointer;
  }
  #next { color: var(--bg); background: var(--fg); border-color: var(--fg); }
  button:hover:not(:disabled) { border-color: var(--fg); }
  button:disabled { opacity: .4; cursor: default; }
  .counter { color: var(--muted); font-variant-numeric: tabular-nums; font-size: .9rem; }

  footer { margin-top: 2.5rem; color: var(--muted); font-size: .9rem; }
</style>
</head>
<body>
<main>
  <p class="eyebrow">Lesson {{000N}}</p>
  <h1>{{node}}</h1>
  <p class="shows">{{the one line saying what this shows that the text could not}}</p>

  <div class="stage" id="stage"><!-- inline SVG, a grid of divs, a canvas --></div>

  <p class="caption" id="caption" aria-live="polite"></p>

  <div class="controls">
    <button id="prev" type="button">Back</button>
    <button id="next" type="button">Forward</button>
    <span class="counter" id="counter"></span>
  </div>

  <footer>Predict what happens before you press Forward. Then go back to the lesson.</footer>
</main>

<script>
  // Discrete frames. Use for movement and for state you step through.
  // Each step paints the stage and says what changed. Delete if the page is a
  // static shape, and swap for the knob pattern below if it is a knob.
  const STEPS = [
    { html: "<!-- frame 1 -->", caption: "What is true here, and why." },
    { html: "<!-- frame 2 -->", caption: "What moved, and what caused it." }
  ];

  const stage = document.getElementById("stage");
  const caption = document.getElementById("caption");
  const counter = document.getElementById("counter");
  const prev = document.getElementById("prev");
  const next = document.getElementById("next");
  let i = 0;

  function render() {
    stage.innerHTML = STEPS[i].html;
    caption.textContent = STEPS[i].caption;
    counter.textContent = (i + 1) + " / " + STEPS.length;
    prev.disabled = i === 0;
    next.disabled = i === STEPS.length - 1;
  }

  prev.addEventListener("click", () => { if (i > 0) { i--; render(); } });
  next.addEventListener("click", () => { if (i < STEPS.length - 1) { i++; render(); } });
  document.addEventListener("keydown", (e) => {
    if (e.key === "ArrowLeft") prev.click();
    if (e.key === "ArrowRight") next.click();
  });

  render();

  /* The knob pattern, for a page built on one parameter instead of steps.
     Replace the controls markup with:
       <input type="range" id="knob" min="0" max="100" value="50">
     and this script with:
       const knob = document.getElementById("knob");
       function draw(v) { stage.innerHTML = ...; caption.textContent = ...; }
       knob.addEventListener("input", () => draw(Number(knob.value)));
       draw(Number(knob.value));
     Label the ends of the range. A slider with no units teaches nothing. */
</script>
</body>
</html>
